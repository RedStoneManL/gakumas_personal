<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>__DECK_TITLE__ · Arena 卡组检视</title>
<style>
:root{color-scheme:light;--ink:#192a35;--muted:#68777e;--paper:#f5f6f2;--line:#e0e6e3;--accent:#117568}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Segoe UI","Microsoft YaHei","Yu Gothic",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #259f8c;outline-offset:3px}
[hidden]{display:none!important}.wrap{max-width:1240px;margin:auto;padding:34px 32px 48px}
.brand{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:800}
.mark{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--accent);color:white;font-size:17px;letter-spacing:0}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;padding:26px 0 28px;border-bottom:1px solid var(--line)}
h1{font-size:32px;line-height:1.25;margin:0 0 12px;letter-spacing:-.04em;overflow-wrap:anywhere}p{margin:0}.subtitle{color:var(--muted);font-size:13px}
.metrics{display:flex;gap:25px;flex-shrink:0}.metric strong{display:block;font-size:32px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}.metric span{font-size:12px;color:var(--muted)}
.context{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:18px;font-size:13px}.context span{background:#e8eeea;padding:5px 10px;border-radius:6px}
.accessories{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0 6px}.accessory-section{display:flex;gap:12px;align-items:center}.accessory-title{font-size:12px;color:var(--muted)}.accessory{width:42px;height:42px;padding:0;border:0;background:transparent}.accessory img{width:100%;height:100%;object-fit:contain}.accessory .fallback{font-size:8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:27px 0 16px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{border:0;background:transparent;padding:8px 14px;border-radius:7px;color:var(--muted)}.tab[aria-pressed=true]{background:var(--ink);color:white}
.search-row{display:flex;gap:8px}.search{width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:white}.utility{padding:8px 13px;border:1px solid var(--line);background:white;border-radius:7px;color:var(--ink)}
.grid-note{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0;transition:box-shadow .15s,transform .15s}.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px #123c2510}.card-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px 0;font-size:10px;color:var(--muted)}.ordinal{font-variant-numeric:tabular-nums;letter-spacing:.05em}.rarity{font-weight:750;color:#697783}.rarity.SSR{color:#aa7016}.rarity.SR{color:#556db3}.rarity.SSRL{color:#9f4b88}
.card-open{display:flex;align-items:center;flex-direction:column;padding:12px 10px 9px;background:none;border:0;color:inherit;width:100%;flex:1}.art{width:92px;height:92px;position:relative;display:grid;place-items:center}.art img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 4px #20374814)}.fallback{display:grid;place-items:center;text-align:center;white-space:pre-line;width:100%;height:100%;background:#f0f1f0;border:1px dashed #afbcb7;border-radius:10px;font-size:12px;color:var(--muted)}
.card-name{font-size:13px;font-weight:650;line-height:1.45;margin-top:12px;min-height:38px;display:grid;place-items:center;overflow-wrap:anywhere}.card-info{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:5px}.dot{width:5px;height:5px;display:inline-block;border-radius:50%;background:#be6659;margin:0 4px 1px 0}.mental .dot{background:#6785c0}
.annotations{padding:9px 10px;border-top:1px solid #eef1ef;display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:37px}.tag{font-size:10px;line-height:1.5;background:#f0f3f1;color:#657970;border-radius:4px;padding:2px 5px;overflow-wrap:anywhere}.tag.custom{background:#e5f4ef;color:#147664}.tag.warn{background:#fff0dc;color:#94600f}.tag.enhanced{background:#f6edf6;color:#916d91}
.status{margin:14px 0 0;color:#936322;font-size:12px}.empty{padding:50px 15px;text-align:center;color:var(--muted);grid-column:1/-1;border:1px dashed var(--line);border-radius:12px}.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.foot a{color:var(--accent);text-decoration:none}.hint{margin-top:5px;font-size:11px}
dialog{width:min(710px,calc(100% - 24px));max-height:90vh;border:1px solid var(--line);border-radius:18px;padding:26px;color:var(--ink);box-shadow:0 18px 90px #102d3a30}dialog::backdrop{background:#132d3f70;backdrop-filter:blur(3px)}.dialog-top{display:flex;align-items:flex-start;gap:20px}.dialog-top .art{width:120px;height:120px;flex-shrink:0}.dialog-top h2{font-size:23px;line-height:1.4;margin:7px 0}.close{margin-left:auto;border:1px solid var(--line);background:white;border-radius:50%;width:32px;height:32px;flex-shrink:0}.detail-group{margin-top:21px}.detail-group h3{font-size:13px;color:var(--muted);margin:0 0 9px}.details-grid{display:grid;grid-template-columns:100px 1fr;gap:7px 12px;font-size:13px}.details-grid dt{color:var(--muted)}.details-grid dd{margin:0;overflow-wrap:anywhere}.detail-tags{display:flex;gap:6px;flex-wrap:wrap}.detail-tags .tag{font-size:12px;padding:4px 8px}details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:12px}summary{cursor:pointer;color:var(--muted)}pre{padding:13px;background:#f3f5f3;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 Consolas,monospace}
@media(max-width:1050px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{align-items:flex-start}.metrics{gap:16px}.metric strong{font-size:25px}h1{font-size:27px}}
@media(max-width:620px){.wrap{padding:22px 16px}.hero{flex-direction:column;gap:19px}.metrics{gap:29px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.art{width:76px;height:76px}.card-name{font-size:11px;min-height:34px}.card-open{padding:8px 6px}.card-head{padding:7px 8px 0}.annotations{padding:7px}.search-row{width:100%}.search{flex:1;min-width:0}.grid-note{font-size:11px}.dialog-top{gap:12px}.dialog-top .art{width:78px;height:78px}.dialog-top h2{font-size:18px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
@media print{body{background:white}.wrap{max-width:none;padding:10px}.toolbar,.status,.utility,.foot a{display:none!important}.grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.card{break-inside:avoid}.card[hidden]{display:flex!important}.art{width:72px;height:72px}.card-name{font-size:10px}.hero{padding:12px 0}.metrics strong{font-size:22px}.foot{font-size:9px}.grid-note{display:none}dialog{display:none}}
</style>
</head>
<body>
<main class="wrap">
 <div class="brand"><span class="mark" aria-hidden="true">▥</span>ARENA / 卡组检视</div>
 <header class="hero"><div><h1 id="title">__DECK_TITLE__</h1><p class="subtitle" id="subtitle">完整卡组 · 保留每个副本</p></div><div class="metrics" id="metrics"></div></header>
 <div class="context" id="context"></div><div class="accessories" id="accessories"></div>
 <section aria-label="卡组">
  <div class="toolbar"><div class="tabs" aria-label="卡牌筛选" id="filters"></div><div class="search-row"><input class="search" id="search" type="search" aria-label="搜索卡名或 ID" placeholder="搜索卡名或 ID…"><button class="utility" id="print">打印 / 存为 PDF</button></div></div>
  <div class="grid-note"><span id="visible-count" aria-live="polite"></span><span>按输入顺序排列 · 点击卡牌查看详情</span></div>
  <div class="grid" id="cards"></div><p class="status" id="status" aria-live="polite"></p>
 </section>
 <footer class="foot"><div>图标为原始卡面，定制、成长和附加能力请查看标签与详情。<p class="hint" id="image-mode"></p></div><a href="https://github.com/surisuririsu/gakumas-tools" target="_blank" rel="noopener noreferrer">图标与卡牌资料 · Gakumas Tools ↗</a></footer>
 <noscript><p class="status">请在启用 JavaScript 的浏览器中打开此文件以显示卡组。</p></noscript>
</main>
<dialog id="detail" aria-labelledby="detail-title"><div id="detail-body"></div></dialog>
<script id="deck-data" type="application/json">__DECK_DATA__</script>
<script>
'use strict';
const deck=JSON.parse(document.getElementById('deck-data').textContent);
const $=id=>document.getElementById(id);
const node=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const tag=(text,cls='')=>node('span','tag '+cls,text);
const failedImages=new Set();
$('image-mode').textContent=deck.source.image_source==='local'?'图片已嵌入此文件，可离线打开；缺图仍保留卡名和副本信息。':'图片使用远程链接，需要联网加载；缺图仍保留卡名和副本信息。';
function updateStatus(){const notes=[];if(deck.summary.unknown)notes.push(`${deck.summary.unknown} 张未知卡牌`);if(deck.summary.missing_icons)notes.push(`${deck.summary.missing_icons} 张卡牌暂无图标`);if(deck.source.local_images?.failed)notes.push(`${deck.source.local_images.failed} 个图标未能从本地缓存取得，请重新生成预览`);if(failedImages.size)notes.push(`${failedImages.size} 个图片资源未能加载`);if(deck.summary.duplicate_instance_ids)notes.push(`${deck.summary.duplicate_instance_ids} 个副本 ID 重复，请检查输入`);$('status').textContent=notes.join(' · ')}
function art(url,name,small=false){const box=node('span',small?'':'art');const fallback=node('span','fallback',small?'?':'暂无图标');box.append(fallback);if(url){const img=document.createElement('img');img.alt=name;img.decoding='async';img.referrerPolicy='no-referrer';img.addEventListener('load',()=>{fallback.hidden=true});img.addEventListener('error',()=>{img.hidden=true;fallback.textContent=small?'?':'图片未加载';failedImages.add(url);updateStatus()});box.append(img);img.src=url;}return box}
function detailBlock(parent,title,text){const d=document.createElement('details');d.append(node('summary','',title),node('pre','',typeof text==='string'?text:JSON.stringify(text,null,2)));parent.append(d)}
function showDetail(c){const d=$('detail-body');d.replaceChildren();const top=node('div','dialog-top');top.append(art(c.icon_url,c.name));const text=node('div');text.append(node('p','subtitle',`第 ${c.index} 张 · ${c.rarity} · ${c.type_label}`));const h=node('h2','',c.name);h.id='detail-title';text.append(h);top.append(text);const close=node('button','close','×');close.setAttribute('aria-label','关闭详情');close.onclick=()=>$('detail').close();top.append(close);d.append(top);
 const group=node('div','detail-group');const dl=node('dl','details-grid');for(const [k,v] of [['副本 ID',c.instance_id],['定义 ID',c.definition_id],['相同定义',`${c.copies} 张`],['强化',c.upgraded?'已强化':'未强化']]){dl.append(node('dt','',k),node('dd','',String(v)))}group.append(dl);d.append(group);
 const custom=node('div','detail-group');custom.append(node('h3','','此副本的定制'));const labels=node('div','detail-tags');if(c.customization_labels.length)c.customization_labels.forEach(x=>labels.append(tag(`${x.name} · Lv.${x.level}`,'custom')));else labels.append(node('p','subtitle','无定制'));custom.append(labels);d.append(custom);
 if(Object.keys(c.growth).length)detailBlock(d,'成长数值',c.growth);if(c.bindings.length)detailBlock(d,`附加能力（${c.bindings.length}）`,c.bindings);
 if(c.definition){const def=c.definition;detailBlock(d,'原始卡牌效果（不含定制与成长）',{conditions:def.conditions,cost:def.cost,actions:def.actions,effects:def.effects,limit:def.limit})}detailBlock(d,'完整副本输入',c.input);$('detail').showModal()}
$('subtitle').textContent=deck.boundary==='before_opening'?'入场前卡组 · 尚未进行开局补牌':'完整卡组 · 保留每个副本';
for(const [key,label] of [['cards','张卡牌'],['definitions','种定义'],['upgraded','张已强化'],['customized','张有定制']]){const m=node('div','metric');m.append(node('strong','',String(deck.summary[key])),node('span','',label));$('metrics').append(m)}
const context=[];if(deck.idol.name)context.push(`${deck.idol.name} · ${deck.idol.title}`);if(deck.plan)context.push(deck.plan);if(deck.resources.stamina!==undefined)context.push(`体力 ${deck.resources.stamina} / ${deck.resources.max_stamina??'—'}`);if(deck.scoring?.mode==='percent')context.push(['Vo','Da','Vi'].map((t,i)=>`${t} ${deck.scoring.values[i]}%`).join(' / '));context.forEach(x=>$('context').append(node('span','',x)));
for(const [label,items] of [['P 道具',deck.p_items],['P 饮料',deck.drinks]]){if(!items.length)continue;const row=node('div','accessory-section');row.append(node('span','accessory-title',label));for(const item of items){const el=node('div','accessory');el.title=item.name;el.setAttribute('aria-label',item.name);el.append(art(item.icon_url,item.name,true));row.append(el)}$('accessories').append(row)}
const tiles=deck.cards.map(c=>{const tile=node('article','card '+c.type);tile.dataset.cardId=c.definition_id;tile.dataset.instanceId=c.instance_id;const head=node('div','card-head');head.append(node('span','ordinal',String(c.index).padStart(2,'0')),node('span','rarity '+c.rarity.replace(/[^a-zA-Z]/g,''),c.rarity));tile.append(head);const btn=node('button','card-open');btn.setAttribute('aria-label',`查看第 ${c.index} 张：${c.name}`);btn.append(art(c.icon_url,c.name),node('span','card-name',c.name));const info=node('span','card-info');const kind=node('span');kind.append(node('i','dot'),document.createTextNode(c.type_label));info.append(kind);if(c.copies>1)info.append(node('span','',`同定义 ${c.copies} 张`));btn.append(info);btn.onclick=()=>showDetail(c);tile.append(btn);const labels=node('div','annotations');if(c.upgraded)labels.append(tag('已强化','enhanced'));c.customization_labels.forEach(x=>labels.append(tag(`${x.name} ${x.level}`,'custom')));if(Object.keys(c.growth).length)labels.append(tag('有成长','custom'));if(c.bindings.length)labels.append(tag(`附加能力 ${c.bindings.length}`,'custom'));if(!c.known)labels.append(tag('未知定义','warn'));if(c.duplicate_instance_id)labels.append(tag('副本 ID 重复','warn'));if(!labels.childElementCount)labels.append(tag('原始卡牌'));tile.append(labels);$('cards').append(tile);return {c,tile}});
const empty=node('p','empty');$('cards').append(empty);let active='all';
const predicates={all:()=>true,active:c=>c.type==='active',mental:c=>c.type==='mental',custom:c=>c.customization_labels.length>0};
function filter(){const q=$('search').value.trim().toLocaleLowerCase();let count=0;tiles.forEach(({c,tile})=>{const hit=predicates[active](c)&&[c.name,c.definition_id,c.instance_id,...c.customization_labels.map(x=>x.name)].join(' ').toLocaleLowerCase().includes(q);tile.hidden=!hit;if(hit)count++});$('visible-count').textContent=`显示 ${count} / ${deck.cards.length} 张`;empty.hidden=count>0;empty.textContent=deck.cards.length?'没有匹配的卡牌，试试其他筛选条件。':'卡组为空，当前输入没有卡牌。';for(const b of $('filters').children)b.setAttribute('aria-pressed',String(b.dataset.filter===active))}
for(const [key,label] of [['all','全部'],['active','主动'],['mental','精神'],['custom','有定制']]){const btn=node('button','tab',label);btn.dataset.filter=key;btn.onclick=()=>{active=key;filter()};$('filters').append(btn)}$('search').addEventListener('input',filter);$('print').onclick=()=>window.print();filter();updateStatus();
</script>
</body>
</html>
